# Provisional starting point. Select history/binning/thresholds on train/validation,
# then freeze all choices before the held-out test period.
dataset: UCI Messages
source: TGF/1-PreprocessingOfDatasets/UnipartiteNetworks/opsahl-ucsocial/ucimessages.txt
split: chronological
history_visibility: timestamp_strictly_less_than_event_time
history_window_events: 100
activity_statistic: endpoint_interaction_count
activity_quantile_bins: 10
anomaly_proportion: 0.05
seeds: [42, 43, 44]  # repeated paired runs; see metrics_mean_sd.csv
classifier:
  family: sklearn.ensemble.RandomForestClassifier
  n_estimators: 100
  random_state: run_seed
  other_parameters: sklearn_defaults
metrics: [PR-AUC, ROC-AUC, recall_at_1_percent_FPR]
strategies: [random, activity_matched]
